name: Frontend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# новый коммит отменяет проверку старого
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}   

jobs:
  checks:
    name: ESLint, Prettier, tsc, Vitest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      - name: Build check image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: source
          tags: frontend-src
          load: true                  
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: ESLint
        run: docker run --rm frontend-src pnpm run lint

      # проверки выполняются, даже если предыдущие упали, но только если образ собрался
      - name: Prettier
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        run: docker run --rm frontend-src pnpm run format:check

      - name: Typecheck
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        run: docker run --rm frontend-src pnpm run typecheck

      - name: Tests
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        run: docker run --rm frontend-src pnpm run test:run

  image:
    name: Docker image
    needs: [checks]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          build-args: |
            VITE_API_URL=/api/v1
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ci-ok:
    name: CI OK
    if: always()
    needs: [checks, image]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail if any job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
